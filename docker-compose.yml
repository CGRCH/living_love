services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livinglove
      POSTGRES_USER: livinglove
      POSTGRES_PASSWORD: livinglove
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livinglove -d livinglove"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  api:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_livinglove &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    environment:
      DEBUG: "1"
      SECRET_KEY: dev-docker-secret-key-change-me
      DATABASE_URL: postgres://livinglove:livinglove@db:5432/livinglove
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      SUMUP_API_KEY: ${SUMUP_API_KEY:-}
      SUMUP_MERCHANT_CODE: ${SUMUP_MERCHANT_CODE:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
