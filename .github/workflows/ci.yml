name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: sqlite:///:memory:

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: |
          cd backend
          python manage.py migrate
          python manage.py seed_livinglove
          python manage.py runserver 0.0.0.0:8000 &
        env:
          DATABASE_URL: sqlite:///db_ci.sqlite3
          SECRET_KEY: ci-secret
      - run: chmod +x scripts/fetch-demo-images.sh && ./scripts/fetch-demo-images.sh
      - run: |
          cd frontend
          npm ci
          npm run build
          npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: chmod +x scripts/verify-next-css.sh && ./scripts/verify-next-css.sh
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: test-results/
